<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Inteligencia</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2230;--border:#2d333b;--txt:#e6edf3;
--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--amber:#d29922;--grey:#6e7681;--red:#f85149;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;padding:24px;max-width:1100px;margin:0 auto}
h1{font-size:24px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;flex:1;min-width:130px}
.stat .num{font-size:26px;font-weight:700;color:var(--accent)}
.stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--border);color:var(--txt);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:14px;transition:.15s}
.tab:hover{border-color:var(--accent)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.report{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
.report-head{padding:16px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.report-head:hover{background:var(--card2)}
.report-head .meta{flex:1}
.report-date{font-size:13px;color:var(--accent);font-weight:600}
.report-title{font-size:16px;font-weight:600;margin:2px 0}
.report-resumen{font-size:13px;color:var(--muted)}
.report-badges{display:flex;gap:8px;align-items:center;white-space:nowrap}
.pill{font-size:12px;padding:3px 9px;border-radius:12px;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.chev{color:var(--muted);transition:.2s}
.report.open .chev{transform:rotate(90deg)}
.report-body{display:none;padding:0 20px 16px}
.report.open .report-body{display:block}
.fuentes{font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding:12px 0;margin-bottom:8px}
.opp{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.opp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.opp-name{font-weight:600;font-size:15px}
.opp-axes{font-size:12px;color:var(--muted);margin-top:2px}
.score{font-weight:700;font-size:15px;padding:4px 10px;border-radius:8px;white-space:nowrap}
.score.high{background:rgba(63,185,80,.18);color:var(--green)}
.score.mid{background:rgba(210,153,34,.18);color:var(--amber)}
.score.low{background:rgba(110,118,129,.2);color:var(--grey)}
.opp-desc{font-size:13px;color:var(--txt);margin-top:8px}
.opp-foot{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.conf{font-size:11px;padding:2px 8px;border-radius:10px}
.conf-alta{background:rgba(63,185,80,.18);color:var(--green)}
.conf-media{background:rgba(210,153,34,.18);color:var(--amber)}
.conf-baja{background:rgba(248,81,73,.18);color:var(--red)}
.tag-follow{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(88,166,255,.18);color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
</style></head><body>
<h1>📊 Dashboard de Inteligencia</h1>
<div class="sub">Generado automáticamente · última actualización: 2026-06-01 13:33</div>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<div id="content"></div>
<div class="footer">Actualizado por el flujo de CLAUDE.md tras cada reporte · <span id="count"></span></div>
<script>
const DATA = [{"key": "oportunidades", "label": "Oportunidades de Negocio", "reports": [{"date": "2026-05-30", "title": "", "fuentes": "~18 (Indie Hackers, Hacker News, Reddit, Product Hunt Mayo 2026, YC Spring+Summer 2026 RFS, GetLatka, Starter Story, GitHub Gist AI Playbook, Fortune, Jobboardly, Acquire.com, Upwork, Superframeworks, VC Cafe, Medium/blogs especializados)", "resumen": "El modelo \"usa IA internamente y cobra por el resultado, no por el acceso\" domina las señales de 2026 — YC lo pide explícitamente, el mercado lo valida, y los costos de arranque son mínimos.", "opps": [{"name": "Agencia de Automatización con IA (Productized Service)", "score": 16, "axes": "Factibilidad 5 · Impacto 4 · Velocidad 5 · Defensibilidad 2", "desc": "Usas AI (Claude, GPT-4o, n8n, Make) para entregar trabajo terminado — pipelines de contenido, automatizaciones de CRM, reportes automatizados — y cobras $1.500–$5.000/mes por cliente en retainer.", "why": "Upwork reporta +27% de demanda YoY para freelancers con skills de AI automation (mayo 2026). YC Summer 2026 RFS lo formula textualmente: \"Don't sell access to an AI tool for $50/mo. Use the AI yourself and sell the finished work for $5,000.\"", "conf": "Media-Alta", "follow": false}, {"name": "Producto \"Sube algo → IA procesa → resultado profesional\"", "score": 15, "axes": "Factibilidad 3 · Impacto 5 · Velocidad 3 · Defensibilidad 4", "desc": "El usuario sube un input (selfie, PDF, URL, audio) → la IA produce un output de valor (foto profesional, resumen, briefing). Se cobra por lote o suscripción.", "why": "- HeadshotPro (Danny Postma): $300K/mes, cobro único $29–$69, 60% tráfico orgánico SEO.", "conf": "Alta", "follow": true}, {"name": "Job Board de Nicho", "score": 15, "axes": "Factibilidad 5 · Impacto 3 · Velocidad 4 · Defensibilidad 3", "desc": "Tablero de empleo para un sector muy específico. Cobra $99–$299 por listing a empleadores. Sin código complejo.", "why": "Un fundador lanzó un job board para UX writers en 2023, llegó a $4.200/mes en 14 meses y lo vendió por $96.000.", "conf": "Media", "follow": true}, {"name": "Herramienta \"Company Brain\" / IA para Gestión de Conocimiento", "score": 14, "axes": "Factibilidad 3 · Impacto 5 · Velocidad 2 · Defensibilidad 4", "desc": "SaaS B2B que conecta Slack, Notion, emails y docs internos, los estructura, y los convierte en un sistema de respuestas ejecutables para agentes IA. Precio: $199–$999/mes por empresa.", "why": "YC Summer 2026 RFS lo pide explícitamente. Sin jugador dominante en el segmento SMB.", "conf": "Media", "follow": false}, {"name": "Servicios Profesionales AI-Native (Contabilidad / Compliance / Admin)", "score": 14, "axes": "Factibilidad 2 · Impacto 5 · Velocidad 3 · Defensibilidad 4", "desc": "Empresa de servicios que reemplaza outsourcers humanos con IA para contabilidad, auditoría, cumplimiento fiscal o admin de healthcare. Cobra igual que una firma tradicional, con márgenes del 80–90%.", "why": "YC Spring + Summer 2026 RFS citan específicamente estas áreas como las que los AI-native operators ganarán.", "conf": "Media", "follow": false}, {"name": "API de Automatización de Medios / Imágenes (estilo Bannerbear)", "score": 14, "axes": "Factibilidad 3 · Impacto 4 · Velocidad 3 · Defensibilidad 4", "desc": "API que permite a otras empresas generar automáticamente imágenes, banners, PDFs o videos a partir de templates y datos. Facturación por uso.", "why": "Bannerbear (Jon Yongfook, 1 persona) alcanzó $1M ARR en septiembre 2025. El moat es fuerte: una vez que un cliente integra el API, no se va.", "conf": "Alta", "follow": true}, {"name": "CRM Vertical / Herramienta Industry-Specific", "score": 13, "axes": "Factibilidad 3 · Impacto 4 · Velocidad 2 · Defensibilidad 4", "desc": "CRM hecho para un solo tipo de profesional (fotógrafo, coach fitness, contratista). Precio: $49–$99/mes. 500 clientes = $24.500 MRR con márgenes >80%.", "why": "", "conf": "Media", "follow": false}, {"name": "Interface Premium para Modelos IA (estilo TypingMind)", "score": 13, "axes": "Factibilidad 4 · Impacto 3 · Velocidad 4 · Defensibilidad 2", "desc": "Frontend de alto valor para modelos de IA con features específicos por vertical. TypingMind: $500K primer año (Tony Dinh, solo), ahora $817K ARR.", "why": "", "conf": "Alta", "follow": false}], "n_opps": 8, "avg": 14.2, "follow_count": 3}]}, {"key": "inmobiliario", "label": "Marketing Inmobiliario", "reports": [{"date": "2026-06-01", "title": "", "fuentes": "~15 (Chile: Muller y Pérez, Neohaus, Houm, Dataprop, Portal Innova, Grupo Colibrí PropTech, Assetplan · Mundo: NAR, The Close, HousingWire, Luxury Presence, TikTok for Business, Jamil Academy, Virtuance, HomeStack)", "resumen": "El video corto + IA de respuesta instantánea son hoy el mayor diferenciador de leads; en Chile solo las inmobiliarias top los están usando bien, lo que deja ventana abierta para corredores ágiles.", "opps": [{"name": "Respuesta instantánea con chatbot IA (lead en <60 seg)", "score": 18, "axes": "Leads 5 · Implementación 5 · Costo-eficiencia 5 · Innovación 3", "desc": "Un chatbot con IA en el sitio/landing y WhatsApp que responde, califica y agenda 24/7, en lugar del formulario estático.", "why": "NAR documenta que **78% de los compradores trabajan con el primer agente que responde**, y el tiempo promedio de respuesta del agente es **>15 horas**. Cerrar esa brecha captura leads que hoy se pierden. Costo: $50–$200/mes.", "conf": "Alta", "follow": false}, {"name": "Video corto multi-plataforma (filmar 1 vez, publicar en TikTok+Reels+Shorts)", "score": 17, "axes": "Leads 5 · Implementación 4 · Costo-eficiencia 5 · Innovación 3", "desc": "Guías de barrio y tours de 60 seg grabados una vez y distribuidos el mismo día en TikTok, Reels y Shorts.", "why": "Los **video listings aumentan las consultas en 403%**. Solo **12% de los agentes están en TikTok vs. 92% en Facebook** → arbitraje de atención. La autenticidad supera a la producción pulida.", "conf": "Alta", "follow": false}, {"name": "Home staging virtual con IA", "score": 16, "axes": "Leads 4 · Implementación 5 · Costo-eficiencia 5 · Innovación 2", "desc": "Transformar fotos de propiedades vacías o anticuadas en interiores modernos con IA, en 30–90 segundos por imagen.", "why": "**+200% en solicitudes de visita**, **−50% en tiempo de publicación**, a un costo **70–80% menor** que el staging físico ($10–$50 por propiedad vs. miles).", "conf": "Media-Alta", "follow": false}, {"name": "Tours virtuales 360° como pre-calificador", "score": 16, "axes": "Leads 4 · Implementación 3 · Costo-eficiencia 4 · Innovación 5", "desc": "Recorrido 360°/3D que deja al cliente pre-calificar la propiedad sin visita física.", "why": "Conversión **3.2x superior** a fotos tradicionales. Inmobiliaria Aconcagua (Chile) sumó **+35% de leads calificados** con drone + tours interactivos. Mejora el ratio visita→oferta porque quien pide visita ya viene interesado.", "conf": "Media-Alta", "follow": false}, {"name": "Google Ads geo-segmentado + landing por comuna", "score": 15, "axes": "Leads 5 · Implementación 3 · Costo-eficiencia 3 · Innovación 2", "desc": "Campañas de búsqueda por \"casas en venta + comuna\" con landing dedicada por zona y captura conectada al CRM.", "why": "En Chile las corredoras concentran **67% del presupuesto digital en Google Ads** porque captura intención alta de compra. La inversión digital del sector creció **+28% YoY** (Q1 2026: $12.3B CLP) → el canal está validado por gasto real.", "conf": "Media", "follow": false}, {"name": "Nurturing por WhatsApp + email (7.3 touchpoints)", "score": 14, "axes": "Leads 4 · Implementación 4 · Costo-eficiencia 4 · Innovación 2", "desc": "Secuencia automatizada de seguimiento que acompaña al lead durante el ciclo de ~45 días hasta la consulta calificada.", "why": "Un usuario necesita en promedio **7.3 puntos de contacto** antes de una consulta calificada; **WhatsApp Business y email son los canales de nurturing más efectivos** en Chile. Sin secuencia, el 90% de los leads se enfrían.", "conf": "Media", "follow": false}], "n_opps": 6, "avg": 16.0, "follow_count": 0}]}];
function scoreClass(s){return s>=15?'high':s>=12?'mid':'low'}
function confClass(c){c=(c||'').toLowerCase();if(c.includes('alta'))return 'conf-alta';if(c.includes('baja'))return 'conf-baja';return 'conf-media'}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
let active='all';
function render(){
  const allReports=[];DATA.forEach(g=>g.reports.forEach(r=>allReports.push({...r,group:g.key,glabel:g.label})));
  const shown=active==='all'?allReports:allReports.filter(r=>r.group===active);
  // stats
  const totalOpps=shown.reduce((a,r)=>a+r.n_opps,0);
  const totalFollow=shown.reduce((a,r)=>a+r.follow_count,0);
  const allScores=[];shown.forEach(r=>r.opps.forEach(o=>allScores.push(o.score)));
  const avg=allScores.length?(allScores.reduce((a,b)=>a+b,0)/allScores.length).toFixed(1):'–';
  document.getElementById('stats').innerHTML=
    stat(shown.length,'Reportes')+stat(totalOpps,'Oportunidades')+stat(avg,'Score promedio')+stat(totalFollow,'Seguimientos');
  // tabs
  let tabs=`<div class="tab ${active==='all'?'active':''}" onclick="setTab('all')">Todos</div>`;
  DATA.forEach(g=>{tabs+=`<div class="tab ${active===g.key?'active':''}" onclick="setTab('${g.key}')">${esc(g.label)}</div>`});
  document.getElementById('tabs').innerHTML=tabs;
  // content
  const byDate=[...shown].sort((a,b)=>b.date.localeCompare(a.date));
  let html=byDate.length?'':'<div class="empty">No hay reportes todavía.</div>';
  byDate.forEach((r,i)=>{
    const opps=r.opps.map(o=>`
      <div class="opp">
        <div class="opp-head">
          <div><div class="opp-name">${esc(o.name)}</div><div class="opp-axes">${esc(o.axes)}</div></div>
          <div class="score ${scoreClass(o.score)}">${o.score}/20</div>
        </div>
        <div class="opp-desc">${esc(o.desc)}</div>
        <div class="opp-foot">
          ${o.conf?`<span class="conf ${confClass(o.conf)}">Confianza: ${esc(o.conf)}</span>`:''}
          ${o.follow?'<span class="tag-follow">★ Seguimiento de crecimiento</span>':''}
        </div>
      </div>`).join('');
    html+=`
    <div class="report ${i===0?'open':''}">
      <div class="report-head" onclick="this.parentNode.classList.toggle('open')">
        <div class="meta">
          <div class="report-date">${esc(r.date)} · ${esc(r.glabel)}</div>
          <div class="report-title">${esc(r.title)}</div>
          <div class="report-resumen">${esc(r.resumen)}</div>
        </div>
        <div class="report-badges">
          <span class="pill">${r.n_opps} ideas</span>
          <span class="pill">prom ${r.avg}</span>
          <span class="chev">▶</span>
        </div>
      </div>
      <div class="report-body">
        <div class="fuentes">📚 ${esc(r.fuentes)}</div>
        ${opps||'<div class="empty">Sin oportunidades parseadas.</div>'}
      </div>
    </div>`;
  });
  document.getElementById('content').innerHTML=html;
  document.getElementById('count').textContent=allReports.length+' reportes totales en el archivo';
}
function stat(n,l){return `<div class="stat"><div class="num">${n}</div><div class="lbl">${l}</div></div>`}
function setTab(t){active=t;render()}
render();
</script></body></html>
